<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practiica2</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
    .header    { background-color: #9b7aa0; min-height: 80px; }
    .sidebar   { background-color: #f5ddd5; min-height: 400px; }
    .navbar-top{ background-color: #72bf8a; min-height: 40px; }
    .card-gray { background-color: #9e8f9e; min-height: 80px; }
    .card-blue { background-color: #7f9fc0; min-height: 100px; }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="row mb-2">
    <div class="col-12 header"></div>
  </div>

  <!-- Sidebar + Contenido principal -->
  <div class="row">

    <!-- Sidebar: col-3 en md+, col-sm-12 en sm -->
    <div class="col-md-3 col-sm-12 sidebar mb-2"></div>

    <!-- Contenido -->
    <div class="col-md-9 col-sm-12">

      <!-- Barra verde -->
      <div class="row mb-2">
        <div class="col-12 navbar-top"></div>
      </div>

      <!-- 3 tarjetas grises - fila 1 -->
      <div class="row mb-2">
        <div class="col-md-4 col-sm-6 mb-2"><div class="card-gray"></div></div>
        <div class="col-md-4 col-sm-6 mb-2"><div class="card-gray"></div></div>
        <div class="col-md-4 col-sm-6 mb-2"><div class="card-gray"></div></div>
      </div>

      <!-- 3 tarjetas grises - fila 2 -->
      <div class="row mb-2">
        <div class="col-md-4 col-sm-6 mb-2"><div class="card-gray"></div></div>
        <div class="col-md-4 col-sm-6 mb-2"><div class="card-gray"></div></div>
        <div class="col-md-4 col-sm-6 mb-2"><div class="card-gray"></div></div>
      </div>

      <!-- 2 tarjetas azules (col-3 y col-6) -->
      <div class="row">
        <div class="col-md-3 col-sm-6"><div class="card-blue"></div></div>
        <div class="col-md-6 col-sm-6"><div class="card-blue"></div></div>
      </div>

    </div>
  </div>

</div>    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
