<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ejercicio Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
  <style>
    .header     { background-color: #9b7aa0; min-height: 80px; }
    .sidebar    { background-color: #f5ddd5; min-height: 400px; }
    .navbar-top { background-color: #72bf8a; min-height: 40px; }
    .card-blue  { background-color: #7f9fc0; min-height: 100px; }
    .contenedor { background-color: lightblue; }
  </style>
</head>
<body>
 
<div class="container contenedor py-3">
 
  <!-- ===== HEADER ===== -->
  <div class="row mb-2">
    <div class="col-12 header rounded"></div>
  </div>
 
  <!-- ===== SIDEBAR + CONTENIDO ===== -->
  <div class="row">
 
    <!-- Sidebar -->
    <div class="col-md-3 col-sm-12 sidebar mb-2 rounded p-3">
      <!-- Botón que abre el modal -->
      <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#miModal">
        Abrir Modal
      </button>
    </div>
 
    <!-- Contenido principal -->
    <div class="col-md-9 col-sm-12">
 
      <!-- Barra verde con alerta -->
      <div class="row mb-2">
        <div class="col-12 navbar-top rounded p-2">
          <div class="alert alert-success mb-0" role="alert">
            ¡Operación realizada con éxito!
          </div>
        </div>
      </div>
 
      <!-- 3 cards grises - fila 1 -->
      <div class="row mb-2">
        <div class="col-md-4 col-sm-6 mb-2">
          <div class="card h-100">
            <img src="https://placehold.co/300x150/888/fff?text=Imagen+Cualquiera" class="card-img-top" alt="Imagen">
            <div class="card-body">
              <h5 class="card-title">Título</h5>
              <p class="card-text">Texto descriptivo</p>
              <a href="#" class="btn btn-primary">Link</a>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-2">
          <div class="card h-100">
            <img src="https://placehold.co/300x150/888/fff?text=Imagen+Cualquiera" class="card-img-top" alt="Imagen">
            <div class="card-body">
              <h5 class="card-title">Título</h5>
              <p class="card-text">Texto descriptivo</p>
              <a href="#" class="btn btn-primary">Link</a>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-2">
          <div class="card h-100">
            <img src="https://placehold.co/300x150/888/fff?text=Imagen+Cualquiera" class="card-img-top" alt="Imagen">
            <div class="card-body">
              <h5 class="card-title">Título</h5>
              <p class="card-text">Texto descriptivo</p>
              <a href="#" class="btn btn-primary">Link</a>
            </div>
          </div>
        </div>
      </div>
 
      <!-- 3 cards grises - fila 2 -->
      <div class="row mb-2">
        <div class="col-md-4 col-sm-6 mb-2">
          <div class="card h-100">
            <img src="https://placehold.co/300x150/888/fff?text=Imagen+Cualquiera" class="card-img-top" alt="Imagen">
            <div class="card-body">
              <h5 class="card-title">Título</h5>
              <p class="card-text">Texto descriptivo</p>
              <a href="#" class="btn btn-primary">Link</a>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-2">
          <div class="card h-100">
            <img src="https://placehold.co/300x150/888/fff?text=Imagen+Cualquiera" class="card-img-top" alt="Imagen">
            <div class="card-body">
              <h5 class="card-title">Título</h5>
              <p class="card-text">Texto descriptivo</p>
              <a href="#" class="btn btn-primary">Link</a>
            </div>
          </div>
        </div>
        <div class="col-md-4 col-sm-6 mb-2">
          <div class="card h-100">
            <img src="https://placehold.co/300x150/888/fff?text=Imagen+Cualquiera" class="card-img-top" alt="Imagen">
            <div class="card-body">
              <h5 class="card-title">Título</h5>
              <p class="card-text">Texto descriptivo</p>
              <a href="#" class="btn btn-primary">Link</a>
            </div>
          </div>
        </div>
      </div>
 
      <!-- Fila inferior: tarjeta azul chica + carousel -->
      <div class="row">
        <div class="col-md-3 col-sm-6 mb-2">
          <div class="card-blue rounded" style="min-height:150px;"></div>
        </div>
        <div class="col-md-6 col-sm-6 mb-2">
          <!-- Carousel -->
          <div id="miCarousel" class="carousel slide h-100" data-bs-ride="carousel">
            <div class="carousel-inner h-100">
              <div class="carousel-item active">
                <img src="https://placehold.co/600x150/7f9fc0/fff?text=Imagen+1" class="d-block w-100 rounded" alt="Imagen 1">
              </div>
              <div class="carousel-item">
                <img src="https://placehold.co/600x150/7f9fc0/fff?text=Imagen+2" class="d-block w-100 rounded" alt="Imagen 2">
              </div>
              <div class="carousel-item">
                <img src="https://placehold.co/600x150/7f9fc0/fff?text=Imagen+3" class="d-block w-100 rounded" alt="Imagen 3">
              </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#miCarousel" data-bs-slide="prev">
              <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#miCarousel" data-bs-slide="next">
              <span class="carousel-control-next-icon" aria-hidden="true"></span>
            </button>
          </div>
        </div>
      </div>
 
    </div><!-- fin col contenido -->
  </div><!-- fin row sidebar+contenido -->
 
</div><!-- fin container -->
 
 
<!-- ===== MODAL ===== -->
<div class="modal fade" id="miModal" tabindex="-1" aria-labelledby="miModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="miModalLabel">Modal</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        Contenido del modal.
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
        <button type="button" class="btn btn-primary">Guardar cambios</button>
      </div>
    </div>
  </div>
</div>
 
 
<!-- ===== FORMULARIO DE CONTACTO ===== -->
<div class="container mt-5 mb-5">
  <h2>Formulario de Contacto</h2>
  <div class="mb-3">
    <label for="nombre" class="form-label">Nombre</label>
    <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
  </div>
  <div class="mb-3">
    <label for="email" class="form-label">Email</label>
    <input type="text" class="form-control" id="email" placeholder="Tu email">
  </div>
  <div class="mb-3">
    <label for="telefono" class="form-label">Teléfono</label>
    <input type="text" class="form-control" id="telefono" placeholder="Tu teléfono">
  </div>
  <div class="mb-3">
    <label for="asunto" class="form-label">Asunto</label>
    <input type="text" class="form-control" id="asunto" placeholder="Asunto del mensaje">
  </div>
  <div class="mb-3">
    <label for="mensaje" class="form-label">Cuerpo del mensaje</label>
    <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribí tu mensaje acá..."></textarea>
  </div>
  <button type="button" class="btn btn-primary">Enviar</button>
</div>
 
 
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
